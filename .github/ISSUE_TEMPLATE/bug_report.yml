name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include confidential files, credentials, or unpatched security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool or area
      options:
        - MCP startup or configuration
        - AI context or token tools
        - CSV or JSON tools
        - QR generation
        - Filesystem security
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include the command, sanitized arguments, and minimal synthetic input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Node version, and MCP client
    validations:
      required: true
